name: B1-1 Root Promotion Preservation Verification
on:
  pull_request:
    paths:
      - 'index.html'
      - 'legacy/round-01-portfolio/**'
      - 'training/round-03-apos/04-src/**'
      - 'training/round-03-apos/05-tests/root-promotion-verify.mjs'
      - '.github/workflows/b1-1-root-promotion.yml'
permissions:
  contents: read
jobs:
  root-and-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Exact PR head checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact SHA guard
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check script syntax
        run: node --check training/round-03-apos/05-tests/root-promotion-verify.mjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify new root and archived legacy
        run: node training/round-03-apos/05-tests/root-promotion-verify.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1-1-root-preservation-${{ github.run_id }}
          path: root-promotion-evidence/
          if-no-files-found: error
          retention-days: 25
